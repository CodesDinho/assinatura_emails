{% extends 'base.html' %}
{% block title %}Confirmação{% endblock %}
{% block content %}
<section class="card">
  <h1>Confirme seus dados</h1>
  <p>Confira as informações oficiais antes de solicitar sua assinatura.</p>

  <div class="employee-box">
    <p><strong>Nome:</strong> {{ employee['full_name'] }}</p>
    <p><strong>Cargo:</strong> {{ employee['job_title'] }}</p>
    <p><strong>E-mail:</strong> {{ employee['email'] }}</p>
  </div>

  <form method="post" action="{{ url_for('solicitar_assinatura') }}">
    <input type="hidden" name="email" value="{{ employee['email'] }}">
    <button type="submit">Enviar minha assinatura</button>
  </form>
</section>
{% endblock %}
